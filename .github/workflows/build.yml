name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      rebuild_native:
        description: "Ignore the native-libs cache and rebuild the dispatch lib"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match each other: LiteRT-LM v0.17.1 pins LiteRT 9fe5be4 (see its WORKSPACE), and the
  # model's QNN contexts were compiled with QAIRT 2.50.0.260828.
  LITERTLM_TAG: v0.17.1
  LITERT_COMMIT: 9fe5be45564c868408e6514c8aabb83e211a0911
  QAIRT_VERSION: 2.50.0.260828
  NDK_VERSION: r28b
  # llama.cpp for the CPU models (bundled as lib/arm64-v8a/libllama_server.so). This commit was
  # tested on the S22+ and supports kimi-linear and lfm2moe.
  LLAMA_CPP_COMMIT: c479922ac520a08969b4c1dc154d7bbb3c386d85
  # Bump to invalidate the native-libs cache when the recipe below changes.
  NATIVE_RECIPE: "2"

jobs:
  # Fast feedback on the Kotlin/Gradle side without waiting for the native build.
  compile:
    name: Compile check (no native libs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon :app:assembleDebug

  native-libs:
    name: QNN runtime + dispatch lib
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Restore native libs
        id: native-cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          path: native-out
          key: native-${{ env.LITERTLM_TAG }}-${{ env.QAIRT_VERSION }}-${{ env.NDK_VERSION }}-r${{ env.NATIVE_RECIPE }}

      - name: Fetch QAIRT ${{ env.QAIRT_VERSION }} (headers + v69 runtime only)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet --user --break-system-packages remotezip
          python3 scripts/fetch_qairt.py --version "$QAIRT_VERSION" --out "$HOME/qairt"
          find "$HOME/qairt/lib" -type f -exec ls -l {} \;

      - name: Free disk space
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Set up NDK ${{ env.NDK_VERSION }}
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Minimal Android SDK for Bazel
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          # android_sdk_repository picks the newest platform/build-tools it finds; give it exactly
          # what LiteRT-LM's own CI uses.
          SDK="$HOME/android-sdk-bazel"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
          ls "$SDK" "$SDK/platforms" "$SDK/build-tools"
          echo "BAZEL_ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Check out LiteRT-LM ${{ env.LITERTLM_TAG }}
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LITERTLM_TAG" https://github.com/google-ai-edge/LiteRT-LM.git "$HOME/litert-lm"
          grep -q "LITERT_REF = \"$LITERT_COMMIT\"" "$HOME/litert-lm/WORKSPACE" \
            || { echo "LiteRT-LM $LITERTLM_TAG does not pin LiteRT $LITERT_COMMIT"; grep LITERT_REF "$HOME/litert-lm/WORKSPACE"; exit 1; }

      - name: Restore Bazel caches
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ env.LITERTLM_TAG }}-${{ github.run_id }}
          restore-keys: bazel-${{ env.LITERTLM_TAG }}-

      - name: Build libLiteRtDispatch_Qualcomm.so
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cd "$HOME/litert-lm"
          export ANDROID_HOME="$BAZEL_ANDROID_SDK" ANDROID_SDK_ROOT="$BAZEL_ANDROID_SDK"
          free -g; nproc
          command -v bazelisk || npm install -g @bazel/bazelisk
          TARGET=@litert//litert/vendors/qualcomm/dispatch:dispatch_api_so
          FLAGS=(--config=android_arm64 --repo_env=LITERT_QAIRT_SDK="$HOME/qairt"
                 --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"
                 --jobs=4 --local_resources=memory=HOST_RAM*.6 --show_timestamps)
          bazelisk --host_jvm_args=-Xmx3g build "${FLAGS[@]}" "$TARGET"
          OUT=$(bazelisk --host_jvm_args=-Xmx3g cquery "${FLAGS[@]}" --output=files "$TARGET" 2>/dev/null | grep 'libLiteRtDispatch_Qualcomm.so$' | head -1)
          echo "built: $OUT"
          mkdir -p "$GITHUB_WORKSPACE/native-out"
          cp -L "$OUT" "$GITHUB_WORKSPACE/native-out/libLiteRtDispatch_Qualcomm.so"

      - name: Save Bazel caches
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ env.LITERTLM_TAG }}-${{ github.run_id }}

      - name: Collect libs + provenance
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          cd native-out
          for f in lib/aarch64-android/libQnnHtp.so lib/aarch64-android/libQnnSystem.so \
                   lib/aarch64-android/libQnnHtpV69Stub.so lib/hexagon-v69/unsigned/libQnnHtpV69Skel.so; do
            cp "$HOME/qairt/$f" .
          done
          READELF="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          {
            echo "LiteRT-LM $LITERTLM_TAG (LiteRT ${LITERT_COMMIT:0:7}), QAIRT $QAIRT_VERSION, NDK $NDK_VERSION"
            echo "built $(date -u +%Y-%m-%dT%H:%MZ) by ${{ github.repository }} run ${{ github.run_id }}"
            echo
            sha256sum *.so | while read -r sum name; do echo "$name $(stat -c %s "$name") ${sum:0:16}"; done
            echo
            echo "dispatch NEEDED: $($READELF -d libLiteRtDispatch_Qualcomm.so | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | tr '\n' ' ')"
            echo "dispatch exports LiteRtDispatchGetApi: $($READELF --dyn-syms libLiteRtDispatch_Qualcomm.so | grep -cw 'LiteRtDispatchGetApi')"
          } > native_libs.txt
          cat native_libs.txt
          # The dispatch lib must not depend on libLiteRt.so: the AAR links LiteRT statically into
          # liblitertlm_jni.so and ships no libLiteRt.so.
          ! $READELF -d libLiteRtDispatch_Qualcomm.so | grep -q 'libLiteRt.so'

      - name: Save native libs
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-out
          key: native-${{ env.LITERTLM_TAG }}-${{ env.QAIRT_VERSION }}-${{ env.NDK_VERSION }}-r${{ env.NATIVE_RECIPE }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native-out
          retention-days: 7

  llama-server:
    name: llama.cpp server (CPU models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Restore
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: llama-out
          key: llama-server-${{ env.LLAMA_CPP_COMMIT }}-${{ env.NDK_VERSION }}-r1

      - uses: nttld/setup-ndk@v1
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout "$LLAMA_CPP_COMMIT"
          cmake -S llama.cpp -B build -G Ninja             -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DANDROID_STL=c++_static             -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF             -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+i8mm+fp16             -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF             -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server --parallel 4
          mkdir llama-out
          cp build/bin/llama-server llama-out/libllama_server.so
          ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip llama-out/libllama_server.so
          echo "llama.cpp ${LLAMA_CPP_COMMIT:0:7} ($(git -C llama.cpp log -1 --format=%cs)), llama-server for arm64 Android" > llama-out/llama_version.txt
          ls -l llama-out

      - name: Save
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llama-out
          key: llama-server-${{ env.LLAMA_CPP_COMMIT }}-${{ env.NDK_VERSION }}-r1

      - uses: actions/upload-artifact@v4
        with:
          name: llama-server
          path: llama-out
          retention-days: 7

  apk:
    name: Debug APK
    needs: [native-libs, llama-server]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: native-out

      - uses: actions/download-artifact@v4
        with:
          name: llama-server
          path: llama-out

      - name: Bundle native libs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp native-out/*.so llama-out/libllama_server.so app/src/main/jniLibs/arm64-v8a/
          { cat native-out/native_libs.txt; echo; cat llama-out/llama_version.txt; } > app/src/main/assets/native_libs.txt
          ls -l app/src/main/jniLibs/arm64-v8a

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug -PrequireNativeLibs=true

      - name: Check APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/|native_libs' | tee apk-libs.txt
          for lib in liblitertlm_jni.so libLiteRtDispatch_Qualcomm.so libQnnHtp.so libQnnSystem.so libQnnHtpV69Stub.so libQnnHtpV69Skel.so libllama_server.so; do
            grep -q "lib/arm64-v8a/$lib" apk-libs.txt || { echo "missing $lib in APK"; exit 1; }
          done
          cp "$APK" "npu-chat-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: npu-chat-apk
          path: npu-chat-${{ github.run_number }}.apk

      - name: Publish "latest" pre-release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="npu-chat-${{ github.run_number }}.apk"
          NOTES="Build ${{ github.run_number }} from ${GITHUB_SHA:0:7}. Install the APK on the phone; it updates in place."
          # Recreate so the tag moves to this commit and only the newest APK is attached.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$APK" --prerelease --title "Latest build" --notes "$NOTES" --target "$GITHUB_SHA"
